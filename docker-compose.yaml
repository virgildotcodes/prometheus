version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    user: root # ← add this line
    restart: unless-stopped
    configs:
      - source: prometheus_inline_cfg
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prom_data:/prometheus
    ports:
      - "9090:9090"

configs:
  prometheus_inline_cfg:
    # no “mode:” line – Compose v3 would reject it
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: "laravel_apps"
          scheme: https
          metrics_path: /prometheus
          static_configs:
            - targets: [ "saasbrainstorm.com" ]
          tls_config:
            insecure_skip_verify: true

volumes:
  prom_data:
