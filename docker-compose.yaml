version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro # Be sure this mounts as a FILE
      - prom_data:/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090" # expose to Grafana & for troubleshooting

volumes:
  prom_data:
