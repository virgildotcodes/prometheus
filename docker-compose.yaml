version: "3.9"

configs:
  prometheus_config: # ← this bundles prometheus.yml
    file: ./prometheus.yml #   (must be in the same repo)

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    configs: # ← inject config into container
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prom_data:/prometheus # data dir persists
    ports:
      - "9090:9090" # internal or public, as you prefer

volumes:
  prom_data:
