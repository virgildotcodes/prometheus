version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    configs:
      - source: prometheus_inline_cfg
        target: /etc/prometheus/prometheus.yml # no need for extra options
    volumes:
      - prom_data:/prometheus
    ports:
      - "9090:9090"

configs:
  prometheus_inline_cfg:
    mode: "0444" # 👈 make it readable by the nobody user
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: "laravel_apps"
          scheme: https
          metrics_path: /prometheus
          static_configs:
            - targets: [ "saasbrainstorm.com" ]
          tls_config:
            insecure_skip_verify: true
volumes:
  prom_data:
