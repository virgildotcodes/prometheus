version: "3.9"

configs:
  prometheus_config: # ships the full Prometheus config into the container
    file: ./prometheus.yml # keep this file in the same repo, next to this compose file

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml # inside‑container path
    volumes:
      - prom_data:/prometheus # persistent TSDB
    ports:
      - "9090:9090" # reach Prometheus (internal or public)

volumes:
  prom_data:
